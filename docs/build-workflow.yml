name: Build & publish site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/img/favicon.svg"
      - "SHA256SUMS"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source integrity
        run: if [ -f SHA256SUMS ]; then sha256sum -c SHA256SUMS; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: pip install pillow
      - name: Generate images and build pages
        run: |
          python3 src/gen_images.py
          python3 build.py
      - name: Commit built site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build site from src [skip ci]" && git push; fi
